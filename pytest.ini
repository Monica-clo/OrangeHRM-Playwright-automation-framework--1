[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --reruns=2
    --reruns-delay=3
    --rerun-except=ApiQuotaExceededError
    --junitxml=reports/junit/results.xml
markers =
    api: API-only contract tests (ReqRes) - no browser needed (added automatically under tests/api)
    e2e: end-to-end tests (added automatically to everything under tests/e2e)
    workflow: one of the 5 end-to-end employee workflows (UI + API)
    positive: happy-path workflow (workflows 2-5)
    negative: negative workflow - the request must be rejected (workflow 1)
    smoke: fast critical checks (workflows 1 and 2)
    regression: extended coverage (workflows 3, 4 and 5)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
junit_family = xunit2
